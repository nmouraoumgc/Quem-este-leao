[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quem-e-este-leao"
version = "1.1.0"
description = "Bot de quizzes visuais «Quem É Este Leão?» para o Sporting CP / #SpacesSporting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Spaces Sporting" }]
dependencies = [
  "opencv-python-headless==4.11.0.86",
  "numpy==2.2.6",
  "pillow==11.3.0",
  "pyyaml==6.0.2",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "typer==0.16.0",
  "rich==14.1.0",
  "apscheduler==3.10.4",
  "tweepy==4.15.0",
  "python-dotenv==1.1.1",
  "httpx==0.28.1",
  "pytesseract==0.3.13",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[project.scripts]
quem-e-este-leao = "quem_e_este_leao.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quem_e_este_leao = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
